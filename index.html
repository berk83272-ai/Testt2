<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Mobil Sorgu Paneli</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a12;
            color: #e0e0e0;
            margin: 0;
            padding: 12px;
            touch-action: manipulation;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #12121f;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin: 0 0 16px 0;
            color: #00e5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .query-area {
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 180px;
            background-color: #1a1a2e;
            color: #00ffcc;
            border: 1.5px solid #00e5ff;
            border-radius: 16px;
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 14px;
            padding: 14px;
            resize: vertical;
            -webkit-appearance: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        button {
            background-color: #00e5ff;
            color: #0a0a12;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            flex: 1;
            min-width: 100px;
            transition: 0.2s;
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.97);
            background-color: #00b8d4;
        }
        select {
            background-color: #1a1a2e;
            color: #e0e0e0;
            border: 1px solid #00e5ff;
            border-radius: 40px;
            padding: 10px 14px;
            font-size: 0.9rem;
            flex: 1;
            min-width: 100px;
        }
        .output {
            margin-top: 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: #0f0f18;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #2a2a3a;
            padding: 10px 6px;
            text-align: left;
            word-break: break-word;
        }
        th {
            background-color: #1e1e2f;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        .message {
            padding: 12px 16px;
            border-radius: 14px;
            margin-top: 10px;
            font-size: 13px;
            word-break: break-word;
        }
        .error {
            background-color: #3a1a1a;
            border-left: 4px solid #ff4444;
            color: #ffaaaa;
        }
        .success {
            background-color: #1a3a1a;
            border-left: 4px solid #44ff44;
            color: #aaffaa;
        }
        .status-bar {
            font-size: 11px;
            margin-top: 12px;
            text-align: center;
            color: #888;
            padding: 8px;
        }
        .suggestion {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .suggestion-chip {
            background-color: #1e1e30;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #00e5ff;
            border: 0.5px solid #00e5ff50;
            cursor: pointer;
        }
        .suggestion-chip:active {
            background-color: #00e5ff20;
        }
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 12px;
            }
            button, select {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
            textarea {
                font-size: 13px;
                height: 140px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📱 SQL Sorgu Paneli</h1>
    <div class="suggestion">
        <div class="suggestion-chip" onclick="setQuery('SELECT * FROM users LIMIT 5')">SELECT * FROM users</div>
        <div class="suggestion-chip" onclick="setQuery('SELECT COUNT(*) FROM orders')">COUNT(*)</div>
        <div class="suggestion-chip" onclick="setQuery('SELECT name, email FROM customers')">name, email</div>
    </div>
    <div class="query-area">
        <textarea id="sqlQuery" placeholder="SELECT * FROM tablo&#10;INSERT INTO ...&#10;UPDATE ... SET ..."></textarea>
        <div class="controls">
            <button onclick="executeQuery()">▶ Çalıştır</button>
            <button onclick="clearOutput()">🗑 Temizle</button>
            <select id="queryType">
                <option value="select">SELECT</option>
                <option value="insert">INSERT</option>
                <option value="update">UPDATE</option>
                <option value="delete">DELETE</option>
            </select>
        </div>
    </div>
    <div id="outputArea" class="output"></div>
    <div class="status-bar" id="statusBar">Hazır | Ctrl+Enter ⚡</div>
</div>

<script>
    // Mobil uyumlu sorgu paneli - palofsc
    const API_ENDPOINT = 'query_handler.php';

    async function executeQuery() {
        const query = document.getElementById('sqlQuery').value.trim();
        const queryType = document.getElementById('queryType').value;
        const outputDiv = document.getElementById('outputArea');
        const statusDiv = document.getElementById('statusBar');

        if (!query) {
            showMessage('⚠ Sorgu boş olamaz.', 'error');
            return;
        }

        const lowerQuery = query.toLowerCase();
        if (lowerQuery.includes('drop ') || lowerQuery.includes('truncate ') || lowerQuery.includes('alter ')) {
            showMessage('❌ DROP/TRUNCATE/ALTER işlemleri devre dışı.', 'error');
            return;
        }

        statusDiv.innerHTML = '⏳ Sorgu çalışıyor...';
        outputDiv.innerHTML = '';

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query, type: queryType })
            });

            const data = await response.json();

            if (data.error) {
                showMessage('❌ Hata: ' + data.error, 'error');
                statusDiv.innerHTML = '⚠ Hata oluştu';
                return;
            }

            if (queryType === 'select') {
                if (data.rows && data.rows.length > 0) {
                    displayMobileTable(data.rows);
                    showMessage(`✅ ${data.rows.length} satır.`, 'success');
                    statusDiv.innerHTML = `✓ ${data.rows.length} sonuç`;
                } else {
                    outputDiv.innerHTML = '<div class="message success">📭 Sonuç yok (0 satır).</div>';
                    statusDiv.innerHTML = '✓ 0 satır';
                }
            } else {
                const affected = data.affectedRows || 0;
                showMessage(`✅ ${affected} satır etkilendi.`, 'success');
                statusDiv.innerHTML = `✓ ${queryType.toUpperCase()} - ${affected} satır`;
                if (data.insertId) {
                    showMessage(`🆔 Eklenen ID: ${data.insertId}`, 'success');
                }
            }
        } catch (err) {
            showMessage('🌐 Bağlantı/API hatası: ' + err.message, 'error');
            statusDiv.innerHTML = '❌ Bağlantı hatası';
        }
    }

    function displayMobileTable(rows) {
        if (!rows || rows.length === 0) return;
        const columns = Object.keys(rows[0]);
        let html = '<table><thead><tr>';
        columns.forEach(col => html += `<th>${escapeHtml(col)}</th>`);
        html += '</tr></thead><tbody>';
        for (const row of rows) {
            html += '<tr>';
            for (const col of columns) {
                let val = row[col];
                if (val === null) val = 'NULL';
                else if (typeof val === 'object') val = JSON.stringify(val).substring(0, 100);
                html += `<td>${escapeHtml(String(val))}</td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        document.getElementById('outputArea').innerHTML = html;
    }

    function showMessage(msg, type) {
        const outputDiv = document.getElementById('outputArea');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerText = msg;
        outputDiv.insertBefore(msgDiv, outputDiv.firstChild);
        setTimeout(() => { if (msgDiv.parentNode) msgDiv.remove(); }, 4000);
    }

    function clearOutput() {
        document.getElementById('outputArea').innerHTML = '';
        document.getElementById('statusBar').innerHTML = 'Temizlendi ✔';
        document.getElementById('sqlQuery').value = '';
        setTimeout(() => {
            if (document.getElementById('statusBar').innerHTML === 'Temizlendi ✔')
                document.getElementById('statusBar').innerHTML = 'Hazır | Ctrl+Enter ⚡';
        }, 1500);
    }

    function setQuery(q) {
        document.getElementById('sqlQuery').value = q;
        document.getElementById('sqlQuery').focus();
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // Mobil: textarea içinde Enter ile gönderme (isteğe bağlı)
    document.getElementById('sqlQuery').addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            executeQuery();
        }
    });

    // Mobil touch için butonlara aktif geri bildirim
    const btns = document.querySelectorAll('button');
    btns.forEach(btn => {
        btn.addEventListener('touchstart', function(e) {
            this.style.opacity = '0.7';
        });
        btn.addEventListener('touchend', function() {
            this.style.opacity = '1';
        });
    });
</script>
</body>
</html>
