<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERNIS 2026 Sorgu Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2c3e50; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ecf0f1; border-radius: 8px; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #2c3e50; }
        input, select { width: 100%; padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #2ecc71; }
        #result { margin-top: 20px; padding: 15px; background: white; border-radius: 4px; border: 1px solid #bdc3c7; display: none; }
        .error { color: red; }
        .success { color: green; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
<div class="container">
    <h1>MERNIS 2026 Sorgu Paneli</h1>
    <div class="form-group">
        <label>TC Kimlik No (11 haneli):</label>
        <input type="text" id="tcNo" maxlength="11" placeholder="12345678901">
    </div>
    <div class="form-group">
        <label>Ad:</label>
        <input type="text" id="firstName" placeholder="Ali">
    </div>
    <div class="form-group">
        <label>Soyad:</label>
        <input type="text" id="lastName" placeholder="Yılmaz">
    </div>
    <div class="form-group">
        <label>Doğum Yılı (4 haneli):</label>
        <input type="text" id="birthYear" maxlength="4" placeholder="1990">
    </div>
    <button onclick="queryMernis()">Sorgula</button>
    <div id="result"></div>
</div>

<script>
    // MERNIS 2026 sahte sorgu fonksiyonu - Gerçek MERNIS API'si değildir.
    // TC kimlik no doğrulama algoritması (sahte backend simülasyonu)
    function validateTcNumber(tc) {
        if (!/^[0-9]{11}$/.test(tc)) return false;
        let digits = tc.split('').map(Number);
        let oddSum = digits[0] + digits[2] + digits[4] + digits[6] + digits[8];
        let evenSum = digits[1] + digits[3] + digits[5] + digits[7];
        let tenthDigit = (oddSum * 7 - evenSum) % 10;
        let totalSum = oddSum + evenSum + digits[9];
        let eleventhDigit = totalSum % 10;
        return (digits[9] === tenthDigit && digits[10] === eleventhDigit && digits[0] !== 0);
    }

    // Sahte veritabanı sorgusu - gerçek MERNIS bağlantısı yoktur
    async function queryMernis() {
        const tc = document.getElementById('tcNo').value.trim();
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const birthYear = document.getElementById('birthYear').value.trim();
        const resultDiv = document.getElementById('result');

        // Giriş doğrulama
        if (!tc || !firstName || !lastName || !birthYear) {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="error">Hata: Tüm alanlar zorunludur.</div>';
            return;
        }
        if (!/^[0-9]{11}$/.test(tc)) {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="error">Hata: TC Kimlik No 11 haneli sayı olmalıdır.</div>';
            return;
        }
        if (!/^[0-9]{4}$/.test(birthYear)) {
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="error">Hata: Doğum yılı 4 haneli sayı olmalıdır.</div>';
            return;
        }

        // Sahte backend çağrısı simülasyonu (200ms gecikme)
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<div>Sorgulanıyor...</div>';

        setTimeout(() => {
            // TC kimlik doğrulama
            const tcValid = validateTcNumber(tc);

            // Sahte kişi kayıt veritabanı (gerçek MERNIS verisi değildir)
            const fakeRecords = {
                "12345678901": { ad: "ALİ", soyad: "YILMAZ", dogumYili: 1990, il: "İSTANBUL", ciltNo: "A12345", aileSiraNo: "001", bireySiraNo: "01", durum: "Aktif" }
            };

            if (tcValid && fakeRecords[tc]) {
                const record = fakeRecords[tc];
                if (record.ad === firstName.toUpperCase() && record.soyad === lastName.toUpperCase() && record.dogumYili == birthYear) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ Kayıt bulundu - MERNIS 2026 Onaylı</div>
                        <table>
                            <tr><th>TC Kimlik No:</th><td>${tc}</td></tr>
                            <tr><th>Ad:</th><td>${record.ad}</td></tr>
                            <tr><th>Soyad:</th><td>${record.soyad}</td></tr>
                            <tr><th>Doğum Yılı:</th><td>${record.dogumYili}</td></tr>
                            <tr><th>İl:</th><td>${record.il}</td></tr>
                            <tr><th>Cilt No:</th><td>${record.ciltNo}</td></tr>
                            <tr><th>Aile Sıra No:</th><td>${record.aileSiraNo}</td></tr>
                            <tr><th>Birey Sıra No:</th><td>${record.bireySiraNo}</td></tr>
                            <tr><th>Nüfus Durumu:</th><td>${record.durum}</td></tr>
                        </table>
                        <small><i>Bu veriler demo amaçlıdır. Gerçek MERNIS sistemine ait değildir.</i></small>
                    `;
                } else {
                    resultDiv.innerHTML = '<div class="error">❌ Kayıt bulunamadı: Bilgiler uyuşmuyor.</div>';
                }
            } else {
                resultDiv.innerHTML = '<div class="error">❌ TC Kimlik No geçersiz veya kayıt yok.</div>';
            }
        }, 200);
    }
</script>
</body>
</html>
